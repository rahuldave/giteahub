[project]
name = "giteahub"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=3.5.0",
    "huggingface-hub>=0.30.2",
    "py-gitea>=0.2.9",
    "pytest>=8.3.5",
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests that require a running Gitea server",
]
testpaths = ["tests"]
python_files = ["test_*.py", "integration_test_*.py"]
